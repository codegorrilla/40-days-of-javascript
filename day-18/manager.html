<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Task Manager</title>
		<link
			rel="stylesheet"
			href="./ui.css" />
		<script
			defer
			src="./manager.js"></script>
	</head>
	<body>
		<h2>Task Manager</h2>

		<input
			type="text"
			id="taskInput"
			placeholder="New Task" />
		<button onclick="addTask()">Add Task</button>

		<input
			type="text"
			id="searchInput"
			placeholder="Search input..."
			onkeyup="filterTasks()" />
		<ul id="taskList"></ul>
	</body>
</html>
